# Compose derives its project name from this file's directory, which is `docker` on BOTH branches.
# Setting it explicitly is what stops an 8.1 `up` from adopting and recreating the 8.3 container.
name: ignition-mcp-81

services:
  ignition-gateway:
    image: inductiveautomation/ignition:8.1.54
    ports:
      - 18188:8088   # 18088 belongs to the 8.3 line
      - 18100:8000
    volumes:
      # The UNSIGNED build output, deliberately — 8.1 inverts 8.3's behaviour here. On 8.1 a
      # module signed with an unknown (self-signed) certificate is QUARANTINED with "certificate
      # not yet accepted" and needs an operator to approve it in the gateway UI, while an unsigned
      # module loads straight away under -Dignition.allowunsignedmodules=true. Release builds are
      # signed with the real release key and installed normally. Rebuild with
      # `./gradlew :modules:mcp:build`, then
      # `docker compose restart` — never `up -d`, which recreates the container and takes the
      # gateway's whole data directory (projects, users) with it, since none is persisted.
      - ../modules/mcp/build/Ignition-MCP-81.unsigned.modl:/usr/local/bin/ignition/user-lib/modules/Ignition-MCP-81.modl:ro
    environment:
      GATEWAY_ADMIN_PASSWORD: password
      IGNITION_EDITION: standard
      ACCEPT_IGNITION_EULA: Y
      ALLOW_UNSIGNED_MODULES: "true"
      # Do NOT set GATEWAY_MODULES_ENABLED. Commissioning treats it as the COMPLETE list of
      # modules to enable, so naming only our module disables every stock module — Perspective
      # included — and they all land in quarantine on the next boot.
    # Dev-only secrets below; 8.1 has no API tokens. To keep this gateway alive past the
    # 2-hour trial, also add to the JVM args below:
    #   -Dmcp.trialWatchdog=true -Dmcp.trialWatchdog.intervalSeconds=10
    # Note these cannot be commented out in place — `command: >` is a folded scalar, so a `#` line
    # inside it is passed to the JVM verbatim rather than treated as a comment.
    command: >
      -n ignition-mcp-81-dev
      -d
      --
      -Dignition.allowunsignedmodules=true
      -Dia.developer.moduleupload=true
      -Dmcp.gateway.readSecret=dev-read-0123456789abcdef0123456789abcdef
      -Dmcp.gateway.writeSecret=dev-write-0123456789abcdef0123456789abcdef

