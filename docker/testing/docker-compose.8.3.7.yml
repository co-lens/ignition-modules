# Pinned 8.3.7 gateway, for verifying the module actually installs and runs on its declared floor.
#
# Separate from docker/docker-compose.yml on purpose: that one tracks the rolling `8.3` tag and is
# the day-to-day dev gateway. This one is pinned to the exact minimum version the module claims to
# support, which is the only version that proves the claim.
#
# Ports and project name are both distinct from every other gateway on this machine, so bringing
# this up cannot touch them.
#
# `docker compose -f ... restart` to pick up a rebuilt module. NEVER `up -d` on a running one:
# nothing here is persisted, so recreating the container takes the projects, tags and API tokens
# with it.
name: mcp-test-837

services:
  ignition-gateway:
    image: inductiveautomation/ignition:8.3.7
    ports:
      - 18300:8088
      - 18301:8000
    volumes:
      # The UNSIGNED build: there are no signing credentials on this machine, and on 8.3 an
      # unsigned module loads fine under the flag below. The cost is that it has no certificate
      # fingerprint to remember, so it re-prompts for commissioning on every restart.
      - ../../modules/mcp/build/Ignition-MCP.unsigned.modl:/usr/local/bin/ignition/user-lib/modules/Ignition-MCP.modl:ro
    environment:
      GATEWAY_ADMIN_PASSWORD: password
      IGNITION_EDITION: standard
      ACCEPT_IGNITION_EULA: Y
      ALLOW_UNSIGNED_MODULES: "true"
      # Reaches RUNNING unattended instead of parking in COMMISSIONING. Needed here because the
      # module is unsigned and so has no fingerprint the gateway can remember across restarts.
      # commission.sh is the older route and does not work on 8.3.7 — its /post-step payload
      # comes back 400.
      ACCEPT_MODULE_CERTS: io.colens.mcp-ign
      # Deliberately no GATEWAY_MODULES_ENABLED: commissioning reads it as the COMPLETE list of
      # modules to enable, so naming ours would disable Perspective and quarantine the rest.
    # -Dmcp.devMode=true replaces the -Dmcp.trialWatchdog and -Dmcp.designer.allowSave flags that
    # used to be here — it implies both — and additionally opens both MCP endpoints, so the manual
    # pass in TESTING.md no longer needs an API key created in the UI. The interval below is kept
    # separately because devMode implies the watchdog, not its cadence.
    command: >
      -n mcp-test-837
      -d
      --
      -Dignition.allowunsignedmodules=true
      -Dia.developer.moduleupload=true
      -Dmcp.devMode=true
      -Dmcp.trialWatchdog.intervalSeconds=10
