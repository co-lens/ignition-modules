[versions]
java = "17"
kotlin = "2.1.10"
kotest = "5.9.1"
ignition = "8.3.7"
modl = "0.5.0"
# PINNED to what the Ignition platform ships in lib/core/common. This is NOT a version to
# bump: POI is compileOnly because the gateway already has it on the parent classloader, so a
# newer bundled copy would be SHADOWED and code compiled against it would die on
# NoSuchMethodError at render time, hours after a green build. Verified against the 8.3.8
# container: poi, poi-ooxml and poi-ooxml-schemas are all 4.1.2.
poi = "4.1.2"

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
modl = { id = "io.ia.sdk.modl", version.ref = "modl" }

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }

ignition-common = { group = "com.inductiveautomation.ignitionsdk", name = "ignition-common", version.ref = "ignition" }
ignition-gateway-api = { group = "com.inductiveautomation.ignitionsdk", name = "gateway-api", version.ref = "ignition" }
ignition-designer-api = { group = "com.inductiveautomation.ignitionsdk", name = "designer-api", version.ref = "ignition" }
ignition-client-api = { group = "com.inductiveautomation.ignitionsdk", name = "client-api", version.ref = "ignition" }

# Perspective stays optional at runtime: compileOnly everywhere, no moduleDependencies entry, so
# the module still loads on a gateway that doesn't have Perspective installed.
ignition-perspective-common = { group = "com.inductiveautomation.ignitionsdk", name = "perspective-common", version.ref = "ignition" }
ignition-perspective-gateway = { group = "com.inductiveautomation.ignitionsdk", name = "perspective-gateway", version.ref = "ignition" }
ignition-perspective-designer = { group = "com.inductiveautomation.ignitionsdk", name = "perspective-designer", version.ref = "ignition" }

poi = { group = "org.apache.poi", name = "poi", version.ref = "poi" }
poi-ooxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "poi" }

kotest-junit = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }

[bundles]
common = ["ignition-common"]
gateway = ["ignition-common", "ignition-gateway-api"]
designer = ["ignition-common", "ignition-designer-api", "ignition-client-api"]
perspectiveGateway = ["ignition-perspective-common", "ignition-perspective-gateway"]
perspectiveDesigner = ["ignition-perspective-common", "ignition-perspective-designer"]
kotest = ["kotest-junit", "kotest-assertions-core"]
poi = ["poi", "poi-ooxml"]
