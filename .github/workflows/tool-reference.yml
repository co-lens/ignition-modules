name: Tool reference is current

# The committed docs/src/data/tools.json is what the site renders, so a stale one is a
# documentation bug that ships. This makes it a merge blocker instead.
#
# A separate file from docs-test.yml because `paths:` filters are per-workflow, and this one has to
# fire on module changes, which docs-test deliberately ignores.
on:
  pull_request:
    paths:
      - 'modules/**'
      - 'tools/tool-docs/**'
      - 'docs/src/data/tools.json'
      - '.github/workflows/tool-reference.yml'

permissions:
  contents: read

concurrency:
  group: tool-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Regenerate and diff
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Same posture as the release workflow: wrappers validated, cache disabled.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-disabled: true
          add-job-summary: on-failure

      # The generator constructs the real tool registries against a stub Ignition context. If a
      # tool ever touches its context during construction, this fails with the method name rather
      # than silently emitting wrong metadata.
      - name: Regenerate the tool reference
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :tools:tool-docs:generateToolDocs

      - name: Fail if the committed reference is stale
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/src/data/tools.json; then
            echo "::error::docs/src/data/tools.json is stale. Run"
            echo "::error::  ./gradlew :tools:tool-docs:generateToolDocs"
            echo "::error::and commit the result."
            git --no-pager diff -- docs/src/data/tools.json
            exit 1
          fi
          echo "Tool reference is current."
