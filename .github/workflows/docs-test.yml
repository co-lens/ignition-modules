name: Docs (build)

# PRs only. The deploy workflow is a separate file rather than a job guarded by an `if`, because a
# guarded job shows as a permanently-skipped check on every PR and so can never be made required.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-test.yml'

# Nothing here writes. The repository default is already `read`; stating it means a future change
# to that default cannot silently widen this job.
permissions:
  contents: read

# Unlike a release, an abandoned docs build has no side effects worth finishing.
concurrency:
  group: docs-test-${{ github.ref }}
  cancel-in-progress: true

# The site is not at the repository root, so every `run:` needs to start there.
defaults:
  run:
    working-directory: docs

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job never pushes; don't leave a token in .git/config

      # Docusaurus 3.10 requires Node >= 20. Pinned rather than floated so an upstream Node release
      # cannot break a docs PR on its own.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # `ci`, never `install`: it installs exactly the committed lockfile and fails if that
      # disagrees with package.json, which is the whole reason for committing one.
      - name: Install
        run: |
          set -euo pipefail
          npm ci

      # The generated tool reference is consumed through a typed JSON import, so a shape change in
      # tools.json surfaces here rather than as an empty table on the site.
      - name: Typecheck
        run: |
          set -euo pipefail
          npm run typecheck

      # onBrokenLinks: 'throw' is what turns a stale cross-page link into a failed check. This site
      # was split out of one long README full of in-page anchors, so that guard earns its keep.
      - name: Build
        run: |
          set -euo pipefail
          npm run build
