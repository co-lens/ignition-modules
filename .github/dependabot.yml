version: 2

updates:
  # The docs site is the only Node in this repo. Docusaurus ships minors monthly, so the six
  # @docusaurus/* packages are grouped into a single PR — they must move together anyway, and six
  # separate PRs a month for one site is noise, not diligence.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      docusaurus:
        patterns:
          - '@docusaurus/*'
          - 'docusaurus*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'

  # Every action is pinned to a commit SHA, which is good for supply chain and bad for staying
  # current — nothing tells you a pin has rotted. This does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'

  # Gradle. Ignition SDK versions are deliberately NOT bumped automatically — requiredIgnitionVersion
  # is a compatibility promise to operators, not a dependency to keep fresh.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: 'com.inductiveautomation.ignitionsdk:*'
